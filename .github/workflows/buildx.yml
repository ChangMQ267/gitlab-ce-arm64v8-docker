name: buildx

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "GitLab CE version, e.g. 17.1.8-ce.0"
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    env:
      GITLAB_DIR: omnibus-gitlab
      DOCKER_DIR: omnibus-gitlab/docker
      IMAGE: ${{ secrets.REGISTRY_USERNAME }}/gitlab-ce-arm64v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Set variables
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            IS_LATEST=false
          else
            VERSION="${{ github.ref_name }}"
            LATEST=$(git tag | sort -rV | head -n 1)
            if [ "${LATEST}" == "${VERSION}" ]; then
              IS_LATEST=true
            else
              IS_LATEST=false
            fi
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IS_LATEST=${IS_LATEST}" >> $GITHUB_ENV
          echo "GITLAB_REF_TAG=$(echo ${VERSION} | sed 's/\-/\+/')" >> $GITHUB_ENV
          echo "MINOR_TAG=$(echo ${VERSION} | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/')" >> $GITHUB_ENV
          echo "PATCH_TAG=$(echo ${VERSION} | sed -E 's/-ce\..*$//')" >> $GITHUB_ENV
          echo "Building ${VERSION} from omnibus-gitlab ref ${GITLAB_REF_TAG}"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ env.IS_LATEST }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.PATCH_TAG }}
            type=raw,value=${{ env.MINOR_TAG }}
      - name: Check out https://github.com/gitlabhq/omnibus-gitlab.git
        uses: actions/checkout@v4
        with:
          repository: gitlabhq/omnibus-gitlab
          path: ${{ env.GITLAB_DIR }}
          ref: ${{ env.GITLAB_REF_TAG }}
      - name: Perpare for building
        shell: bash
        run: |
          echo "PACKAGECLOUD_REPO=gitlab-ce" > ./${{ env.DOCKER_DIR }}/RELEASE
          echo "RELEASE_PACKAGE=gitlab-ce" >> ./${{ env.DOCKER_DIR }}/RELEASE
          echo "RELEASE_VERSION=${{ env.VERSION }}" >> ./${{ env.DOCKER_DIR }}/RELEASE
          echo "DOWNLOAD_URL=https://packages.gitlab.com/gitlab/gitlab-ce/packages/ubuntu/jammy/gitlab-ce_${{ env.VERSION }}_arm64.deb/download.deb" >> ./${{ env.DOCKER_DIR }}/RELEASE
          echo "DOWNLOAD_URL_arm64=https://packages.gitlab.com/gitlab/gitlab-ce/packages/ubuntu/jammy/gitlab-ce_${{ env.VERSION }}_arm64.deb/download.deb" >> ./${{ env.DOCKER_DIR }}/RELEASE
          cat ./${{ env.DOCKER_DIR }}/RELEASE
          echo 'sed -i "s\# ignore-warnings ARM64-COW-BUG\ignore-warnings ARM64-COW-BUG\g" /opt/gitlab/embedded/cookbooks/redis/templates/default/redis.conf.erb' >> ./${{ env.DOCKER_DIR }}/assets/setup
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_DIR }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
